# Add only when host ports 80/443 are unused and ingress rules permit them.
# This does not alter an existing web proxy or Cloudflare Tunnel.
services:
  https:
    image: caddy:2
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?Set a hostname resolving to this VM}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      houselights:
        condition: service_healthy
    cpus: "0.10"
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    init: true
volumes:
  caddy-data:
  caddy-config:
