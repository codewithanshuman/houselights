name: Release verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # Standard runners are free for this public repository. No paid runners,
    # artifact uploads, package publishing or cloud deployment occur here.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci
      - run: npm test
      - name: Build actual Linux container
        run: docker build -t houselights-release .
      - name: Start protected container with isolated storage and no provider credentials
        run: |
          docker volume create houselights-release-data
          docker run -d --name houselights-release -p 127.0.0.1:8080:8080 \
            -e QLOO_MODE=mock -e LLM_MODE=off \
            -e ORGANIZER_TOKEN=ci-only-non-secret-placeholder-credential \
            -e JUDGE_CASES_FILE=/app/deploy/judge-cases.json \
            -e PUBLIC_LANDING_PAGE=judge -e RELEASE_COMMIT="$GITHUB_SHA" \
            -v houselights-release-data:/var/data/houselights houselights-release
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify public routes, protection and experiments
        run: node scripts/verify-release.mjs http://127.0.0.1:8080 --allow-local --allow-synthetic --commit="$GITHUB_SHA"
      - name: Complete a durable proof job and recreate the container
        run: |
          docker exec houselights-release node scripts/container-drill.mjs prepare
          docker stop houselights-release
          docker rm houselights-release
          docker run -d --name houselights-release -p 127.0.0.1:8080:8080 \
            -e QLOO_MODE=mock -e LLM_MODE=off \
            -e ORGANIZER_TOKEN=ci-only-non-secret-placeholder-credential \
            -e JUDGE_CASES_FILE=/app/deploy/judge-cases.json \
            -e PUBLIC_LANDING_PAGE=judge -e RELEASE_COMMIT="$GITHUB_SHA" \
            -v houselights-release-data:/var/data/houselights houselights-release
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify retained decisions, job journal, reconnect and backup restore
        run: |
          docker exec houselights-release node scripts/container-drill.mjs verify
          docker exec houselights-release node scripts/backup.mjs create /tmp/release-backup
          docker exec houselights-release node scripts/backup.mjs verify /tmp/release-backup /tmp/release-restore
      - name: Container logs
        if: always()
        run: docker logs houselights-release || true
