name: Release verification
on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # Standard runners are free for this public repository. No paid runners,
    # artifact uploads, package publishing or cloud deployment occur here.
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci
      - name: Secret scan of tracked files
        run: node scripts/secret-scan.mjs
      - name: Type-check core modules (optimizer, affinity, integrity, replay)
        run: npm run typecheck
      # Runtime dependencies only. The remaining 'high' (undici) is reachable only through
      # the official Qloo harness and has no fix yet; it is recorded in docs/security.md.
      - name: Quoted numbers match the results JSON
        run: npm run claims:check
      - name: Links in README and docs (relative links and anchors)
        run: npm run check:links
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=critical
      - run: npm test
      - name: Reproduce the published judge stress audit
        run: |
          npm run audit:judge-evaluation
          git diff --exit-code -- results/judge-evaluation-audit.json
      - run: npx playwright install --with-deps chromium firefox webkit
        if: matrix.runner == 'ubuntu-24.04'
      - run: npm run test:browser
        if: matrix.runner == 'ubuntu-24.04'
      - name: Configure container-only fixtures after unit tests
        run: |
          cat >> "$GITHUB_ENV" <<'EOF'
          QLOO_API_KEY=ci-only-placeholder-not-a-provider-key
          GROQ_API_KEY=ci-only-placeholder-not-a-provider-key
          ORGANIZER_TOKEN=ci-only-non-secret-placeholder-credential
          EOF
          printf 'RELEASE_COMMIT=%s\n' "$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Check read-only capacity script
        run: sh scripts/host-capacity.sh
      - name: Build actual Linux container
        run: docker compose -f deploy/free-vm/shared.compose.yaml -f deploy/free-vm/ci.override.yaml build
      - name: Start protected container with isolated storage and no provider credentials
        run: |
          docker compose -f deploy/free-vm/shared.compose.yaml -f deploy/free-vm/ci.override.yaml up --no-build -d --wait --wait-timeout 90
          id=$(docker compose -f deploy/free-vm/shared.compose.yaml -f deploy/free-vm/ci.override.yaml ps -q houselights)
          docker inspect --format '{{json .HostConfig}}' "$id" | node --input-type=module -e '
            import assert from "node:assert/strict";
            import {readFileSync} from "node:fs";
            const c=JSON.parse(readFileSync(0,"utf8"));
            assert.equal(c.NanoCpus,500000000);
            assert.equal(c.Memory,1610612736);
            assert.equal(c.MemorySwap,c.Memory);
            assert.equal(c.PidsLimit,256);
            assert.deepEqual(c.PortBindings,{"8080/tcp":[{HostIp:"127.0.0.1",HostPort:"18080"}]});
            assert.equal(c.LogConfig.Config["max-size"],"10m");
            assert.equal(c.LogConfig.Config["max-file"],"3");
            console.log("Actual runtime limits and private port binding verified.");
          '
      - name: Verify public routes, protection and experiments
        run: node scripts/verify-release.mjs http://127.0.0.1:18080 --allow-local --allow-synthetic --commit="$GITHUB_SHA"
      - name: Complete a durable proof job and recreate the container
        run: |
          docker compose -f deploy/free-vm/shared.compose.yaml -f deploy/free-vm/ci.override.yaml exec -T houselights node scripts/container-drill.mjs prepare
          docker compose -f deploy/free-vm/shared.compose.yaml -f deploy/free-vm/ci.override.yaml up --no-build -d --force-recreate --wait --wait-timeout 90
      - name: Verify retained decisions, job journal, reconnect and backup restore
        run: |
          docker compose -f deploy/free-vm/shared.compose.yaml -f deploy/free-vm/ci.override.yaml exec -T houselights node scripts/container-drill.mjs verify
          docker compose -f deploy/free-vm/shared.compose.yaml -f deploy/free-vm/ci.override.yaml exec -T houselights node scripts/backup.mjs create /tmp/release-backup
          docker compose -f deploy/free-vm/shared.compose.yaml -f deploy/free-vm/ci.override.yaml exec -T houselights node scripts/backup.mjs verify /tmp/release-backup /tmp/release-restore
      - name: Container logs
        if: always()
        run: docker compose -f deploy/free-vm/shared.compose.yaml -f deploy/free-vm/ci.override.yaml logs --no-color || true
